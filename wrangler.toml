name = "notion-todoist-sync"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Runs the sync once a minute (the minimum Cron Trigger interval).
[triggers]
crons = ["* * * * *"]

# Sync state (Todoist ↔ Notion ID mapping + last known snapshots) and the run lock.
# Replace database_id with the value printed by `npx wrangler d1 create notion-todoist-sync`.
[[d1_databases]]
binding = "DB"
database_name = "notion-todoist-sync"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[observability]
enabled = true
